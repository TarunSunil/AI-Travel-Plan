<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Travel Planner{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='airplane.png') }}">

  {% block styles %}{% endblock %}

  <script>
    // Injected from server-side env via context_processor (see main.py)
    window.FIREBASE_CONFIG = {{ firebase_config|tojson }};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  {% block head_extra %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}

  <!-- Vercel Web Analytics + Speed Insights -->
  <script>
    window.va = window.va || function(){ (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
